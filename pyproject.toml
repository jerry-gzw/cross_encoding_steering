[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-encoding-steering-evaluation"
version = "1.0.0"
description = "Artifact code for cross-encoding attribution of activation-steering effects."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
]

[project.optional-dependencies]
gpu = [
  "torch>=2.0",
  "transformers>=4.40",
  "accelerate>=0.28",
]
judges = [
  "anthropic>=0.40",
  "google-genai>=1.0",
  "openai>=1.0",
]
dev = ["pytest>=7.0"]
figures = ["matplotlib>=3.7"]

[project.scripts]
cross-encoding-steering = "cross_encoding_steering.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
